name: QA E2E (Android emulator + Maestro)

# 在 GitHub ubuntu 机器上起 Android 模拟器（KVM），装 QA 测试包（登录页带「Test Backend」），
# 跑 limeng9088/luckgram-qa 里的 Maestro 用例。用例和账号池都在 luckgram-qa，见其 README。
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: '已有 QA 包的 run id（Build Luckgram APK，qa=true，abis 含 x86_64）；留空则先在本分支编一个（约 40 分钟）'
        required: false
        default: ''
      flows:
        description: 'luckgram-qa 里的用例路径（空格分隔），例如 maestro/android/smoke 或 maestro/android/features/06-keyword-folders'
        required: false
        default: 'maestro/android/smoke'
      account:
        description: 'luckgram-qa/accounts.md 里的账号组 ID'
        required: false
        default: 'A1'
      qa_ref:
        description: 'luckgram-qa 的分支 / commit'
        required: false
        default: 'master'
      api_level:
        description: '模拟器 Android API level'
        required: false
        default: '34'
  push:  # TEMP: 验证用，开 PR 前删除
    branches: [ci/qa-test-backend]
  schedule:
    # master 每晚回归：北京时间 02:00
    - cron: '0 18 * * *'

concurrency:
  group: qa-e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # 复用 build.yml 需要；QA 包不会发 release
  actions: read     # 下载其他 run 的产物

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.build_run_id == ''
    uses: ./.github/workflows/build.yml
    with:
      abis: x86_64
      qa: true
    secrets: inherit

  e2e:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FLOWS: ${{ github.event_name == 'schedule' && 'maestro/android/smoke maestro/android/regression' || inputs.flows || 'maestro/android/smoke' }}
      ACCOUNT: ${{ github.event_name == 'schedule' && 'RA' || inputs.account || 'A1' }}
      API_LEVEL: ${{ inputs.api_level || '34' }}
      OUT: ${{ github.workspace }}/qa-out
    steps:
      - name: Checkout luckgram-qa
        uses: actions/checkout@v4
        with:
          repository: limeng9088/luckgram-qa
          ref: ${{ inputs.qa_ref || 'master' }}
          ssh-key: ${{ secrets.QA_REPO_DEPLOY_KEY }}
          path: qa

      - name: Download QA APK
        uses: actions/download-artifact@v4
        with:
          pattern: luckgram-android-qa-*
          merge-multiple: true
          path: apk
          run-id: ${{ inputs.build_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Check APK
        run: |
          APK=$(ls apk/*-qa.apk | head -1)
          test -n "$APK" || { echo "::error::no *-qa.apk in run ${{ inputs.build_run_id || github.run_id }}（需要 qa=true 的构建）"; exit 1; }
          unzip -l "$APK" | grep -q 'lib/x86_64/' || { echo "::error::$APK has no x86_64 libs; rebuild with abis=x86_64"; exit 1; }
          echo "APK=$GITHUB_WORKSPACE/$APK" >> "$GITHUB_ENV"
          ls -l "$APK"

      - name: Test account
        run: python3 qa/ci/account.py "$ACCOUNT" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro
        run: bash qa/ci/install-maestro.sh

      - name: Run Maestro on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash qa/ci/android-run.sh "$APK" $FLOWS

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report-android-${{ github.run_number }}-${{ github.run_attempt }}
          path: qa-out
          if-no-files-found: warn
