name: Build Luckgram APK

on:
  workflow_dispatch:
    inputs:
      abis:
        description: 'ABI 列表（空格分隔），例如 "arm64-v8a" 或 "armeabi-v7a arm64-v8a x86 x86_64"'
        required: false
        default: 'arm64-v8a'
      qa:
        description: 'QA 测试包：登录页显示「Test Backend」开关（Telegram 测试服务器）。模拟器测试用 abis=x86_64'
        type: boolean
        required: false
        default: false
  # QA E2E workflow 复用本 workflow 出测试包
  workflow_call:
    inputs:
      abis:
        type: string
        required: false
        default: 'arm64-v8a'
      qa:
        type: boolean
        required: false
        default: false
  push:
    branches: [master]
    paths-ignore: ['**.md']

concurrency:
  group: build-${{ github.ref }}${{ inputs.qa && '-qa' || '' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      NDK_VERSION: 27.2.12479018
      ABIS: ${{ inputs.abis || 'arm64-v8a' }}
      QA: ${{ inputs.qa && 'true' || 'false' }}
    steps:
      # 原生依赖（ffmpeg/td/boringssl 等）体积大，先腾出磁盘空间
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # 从 Actions secrets 注入 Telegram api_id / api_hash；未配置则直接失败，避免回落到官方凭证
      - name: Inject Telegram API credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          api_id, api_hash = os.environ.get("TG_API_ID", ""), os.environ.get("TG_API_HASH", "")
          if not re.fullmatch(r"[0-9]+", api_id) or not re.fullmatch(r"[0-9a-f]{32}", api_hash):
              sys.exit("::error::TG_API_ID / TG_API_HASH secrets missing or malformed")
          p = "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          s = open(p).read()
          s, n1 = re.subn(r"public static int APP_ID = \d+;", f"public static int APP_ID = {api_id};", s)
          s, n2 = re.subn(r'public static String APP_HASH = "[0-9a-f]*";', f'public static String APP_HASH = "{api_hash}";', s)
          if n1 != 1 or n2 != 1:
              sys.exit("::error::BuildVars.java pattern not found")
          open(p, "w").write(s)
          print("api credentials injected")
          PY
          ! grep -q '014b35b6184100b085b0d0572f9b5103' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

      # 用 secrets 中的 Luckgram 正式签名替换仓库自带的公开测试 keystore；缺失则失败
      - name: Inject release signing key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEY_ALIAS: luckgram  # 别名非机密；放进 secrets 会导致日志中所有 "luckgram" 被打码
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for v in RELEASE_KEYSTORE_B64 RELEASE_KEY_ALIAS RELEASE_STORE_PASSWORD RELEASE_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::secret $v missing"; exit 1; }
          done
          printf %s "$RELEASE_KEYSTORE_B64" | base64 -d > TMessagesProj/config/release.keystore
          python3 - <<'PY'
          import os, re
          p = "gradle.properties"
          s = open(p).read()
          for k in ("RELEASE_KEY_ALIAS", "RELEASE_STORE_PASSWORD", "RELEASE_KEY_PASSWORD"):
              s, n = re.subn(rf"^{k}=.*$", lambda m, k=k: f"{k}={os.environ[k]}", s, flags=re.M)
              assert n == 1, k
          open(p, "w").write(s)
          print("signing config injected")
          PY

      # 默认只编 arm64-v8a 以缩短原生编译时间；只改 CI 工作副本，不提交
      - name: Restrict ABIs
        run: |
          list=$(printf '"%s", ' $ABIS); list=${list%, }
          sed -i "s/abiFilters \"armeabi-v7a\", \"arm64-v8a\", \"x86\", \"x86_64\"/abiFilters $list/" TMessagesProj_App/build.gradle
          grep -n abiFilters TMessagesProj_App/build.gradle

      - name: Build afat release APK
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace -PLUCKGRAM_QA=$QA -Porg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      # 正式包必须 QA_BUILD=false（不带测试服务器开关），QA 包必须为 true
      - name: Verify QA flag
        run: |
          F=$(find TMessagesProj/build/generated -path '*release*' -name BuildConfig.java -path '*org/telegram/messenger*' | head -1)
          grep -n QA_BUILD "$F"
          grep -q "QA_BUILD = $QA;" "$F" || { echo "::error::QA_BUILD does not match QA=$QA"; exit 1; }

      # 从最终 APK 的 dex 里读 BuildConfig（luckgram-qa/ci/apk-buildconfig.py，w-1014）：
      # 正式包 QA_BUILD 必须为 False、API 是正式地址；QA 包 QA_BUILD 必须为 True、API 必须是 api-dev（字段不存在时跳过 API 检查）。
      - name: Checkout luckgram-qa (APK checks)
        uses: actions/checkout@v4
        with:
          repository: limeng9088/luckgram-qa
          ref: master
          ssh-key: ${{ secrets.QA_REPO_DEPLOY_KEY }}
          path: .qa

      - name: Verify BuildConfig in APK
        run: |
          APK=TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          python3 .qa/ci/apk-buildconfig.py "$APK" | tee /tmp/buildconfig.txt
          python3 - <<'PY'
          import os, re, sys
          vals = dict(re.findall(r"^(\w+) = (.*)$", open("/tmp/buildconfig.txt").read(), re.M))
          qa = os.environ["QA"] == "true"
          if vals.get("QA_BUILD") != ("True" if qa else "False"):
              sys.exit(f"::error::QA_BUILD in APK is {vals.get('QA_BUILD')!r}, expected {qa} (QA={os.environ['QA']})")
          url = vals.get("LUCKGRAM_API_URL")
          if url is not None:
              url = url.strip("'")
              if not qa and url != "https://api.luckgram.cc":
                  sys.exit(f"::error::release APK points to {url}, expected https://api.luckgram.cc")
              if qa and url != "https://api-dev.luckgram.cc":
                  # QA 规则：不碰 prod。QA 包跑 AI 自检会打到这个地址
                  sys.exit(f"::error::QA APK points to {url}; QA builds must use https://api-dev.luckgram.cc")
          print("BuildConfig OK")
          PY

      - name: Verify signing certificate
        env:
          # Luckgram 正式签名证书 SHA-256（公开信息）
          EXPECTED_CERT_SHA256: 8cfd617fa2843f778789cf9f1048f0f5e023dcd1b70c14430900a66a72492db1
        run: |
          APK=TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          OUT=$("$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$APK")
          echo "$OUT" | grep -E "certificate DN|SHA-256"
          echo "$OUT" | grep -qi "SHA-256 digest: $EXPECTED_CERT_SHA256" || { echo "::error::APK not signed with Luckgram key"; exit 1; }

      - name: Verify package name
        run: |
          APK=TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/36.0.0/aapt2)
          "$AAPT" dump badging "$APK" | grep -E "^package:|application-label:"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.luckgram.messenger'"
          SUFFIX=""; [ "$QA" = true ] && SUFFIX="-qa"
          mkdir -p out && cp "$APK" "out/luckgram-$(grep APP_VERSION_NAME gradle.properties | cut -d= -f2)-${ABIS// /_}${SUFFIX}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luckgram-android-${{ env.QA == 'true' && 'qa-' || '' }}${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error

      - name: GitHub release
        if: github.ref == 'refs/heads/master' && env.QA != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep APP_VERSION_NAME gradle.properties | cut -d= -f2)
          gh release create "android-${VER}-${GITHUB_RUN_NUMBER}" out/*.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Luckgram Android ${VER} (${GITHUB_RUN_NUMBER})" \
            --notes "Signed release APK (${ABIS}) built from ${GITHUB_SHA}."
