name: Build Luckgram APK

on:
  workflow_dispatch:
    inputs:
      abis:
        description: 'ABI 列表（空格分隔），例如 "arm64-v8a" 或 "armeabi-v7a arm64-v8a x86 x86_64"'
        required: false
        default: 'arm64-v8a'
  push:
    branches: [master]
    paths-ignore: ['**.md']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      NDK_VERSION: 27.2.12479018
      ABIS: ${{ github.event.inputs.abis || 'arm64-v8a' }}
    steps:
      # 原生依赖（ffmpeg/td/boringssl 等）体积大，先腾出磁盘空间
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # 从 Actions secrets 注入 Telegram api_id / api_hash；未配置则直接失败，避免回落到官方凭证
      - name: Inject Telegram API credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          api_id, api_hash = os.environ.get("TG_API_ID", ""), os.environ.get("TG_API_HASH", "")
          if not re.fullmatch(r"[0-9]+", api_id) or not re.fullmatch(r"[0-9a-f]{32}", api_hash):
              sys.exit("::error::TG_API_ID / TG_API_HASH secrets missing or malformed")
          p = "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          s = open(p).read()
          s, n1 = re.subn(r"public static int APP_ID = \d+;", f"public static int APP_ID = {api_id};", s)
          s, n2 = re.subn(r'public static String APP_HASH = "[0-9a-f]*";', f'public static String APP_HASH = "{api_hash}";', s)
          if n1 != 1 or n2 != 1:
              sys.exit("::error::BuildVars.java pattern not found")
          open(p, "w").write(s)
          print("api credentials injected")
          PY
          ! grep -q '014b35b6184100b085b0d0572f9b5103' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

      # 用 secrets 中的 Luckgram 正式签名替换仓库自带的公开测试 keystore；缺失则失败
      - name: Inject release signing key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEY_ALIAS: luckgram  # 别名非机密；放进 secrets 会导致日志中所有 "luckgram" 被打码
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for v in RELEASE_KEYSTORE_B64 RELEASE_KEY_ALIAS RELEASE_STORE_PASSWORD RELEASE_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::secret $v missing"; exit 1; }
          done
          printf %s "$RELEASE_KEYSTORE_B64" | base64 -d > TMessagesProj/config/release.keystore
          python3 - <<'PY'
          import os, re
          p = "gradle.properties"
          s = open(p).read()
          for k in ("RELEASE_KEY_ALIAS", "RELEASE_STORE_PASSWORD", "RELEASE_KEY_PASSWORD"):
              s, n = re.subn(rf"^{k}=.*$", lambda m, k=k: f"{k}={os.environ[k]}", s, flags=re.M)
              assert n == 1, k
          open(p, "w").write(s)
          print("signing config injected")
          PY

      # 默认只编 arm64-v8a 以缩短原生编译时间；只改 CI 工作副本，不提交
      - name: Restrict ABIs
        run: |
          list=$(printf '"%s", ' $ABIS); list=${list%, }
          sed -i "s/abiFilters \"armeabi-v7a\", \"arm64-v8a\", \"x86\", \"x86_64\"/abiFilters $list/" TMessagesProj_App/build.gradle
          grep -n abiFilters TMessagesProj_App/build.gradle

      - name: Build afat release APK
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace -Porg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Verify signing certificate
        env:
          # Luckgram 正式签名证书 SHA-256（公开信息）
          EXPECTED_CERT_SHA256: 8cfd617fa2843f778789cf9f1048f0f5e023dcd1b70c14430900a66a72492db1
        run: |
          APK=TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          OUT=$("$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$APK")
          echo "$OUT" | grep -E "certificate DN|SHA-256"
          echo "$OUT" | grep -qi "SHA-256 digest: $EXPECTED_CERT_SHA256" || { echo "::error::APK not signed with Luckgram key"; exit 1; }

      - name: Verify package name
        run: |
          APK=TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/36.0.0/aapt2)
          "$AAPT" dump badging "$APK" | grep -E "^package:|application-label:"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.luckgram.messenger'"
          mkdir -p out && cp "$APK" "out/luckgram-$(grep APP_VERSION_NAME gradle.properties | cut -d= -f2)-${ABIS// /_}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luckgram-android-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error

      - name: GitHub release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep APP_VERSION_NAME gradle.properties | cut -d= -f2)
          gh release create "android-${VER}-${GITHUB_RUN_NUMBER}" out/*.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Luckgram Android ${VER} (${GITHUB_RUN_NUMBER})" \
            --notes "Signed release APK (${ABIS}) built from ${GITHUB_SHA}."

      # S5: tell the Luckgram API about the new release (GET /v1/version).
      - name: Publish version to Luckgram API
        if: github.ref == 'refs/heads/master'
        env:
          TOKEN_DEV: ${{ secrets.LUCKGRAM_RELEASE_TOKEN_DEV }}
          TOKEN_PROD: ${{ secrets.LUCKGRAM_RELEASE_TOKEN_PROD }}
        run: |
          VER=$(grep APP_VERSION_NAME gradle.properties | cut -d= -f2)
          # build = CI run number: APP_VERSION_CODE stays the same across
          # releases of one versionName (run 6 and run 36 are both 7183), and the
          # installed versionCode is APP_VERSION_CODE*10+abi. The app reports the
          # same run number (BuildConfig.LUCKGRAM_BUILD, S5 app part).
          CODE=$GITHUB_RUN_NUMBER
          TAG="android-${VER}-${GITHUB_RUN_NUMBER}"
          APK=$(basename out/*.apk)
          BODY=$(printf '{"platform":"%s","version":"%s","build":%s,"url":"%s","source":"%s"}' \
            android "$VER" "$CODE" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK}" "${GITHUB_REPOSITORY}@${GITHUB_SHA} run ${GITHUB_RUN_NUMBER}")
          # Tokens only via env -> stdin (never argv); a missing secret skips that stage.
          set -euo pipefail
          publish() {
            local host=$1 token=$2
            if [ -z "$token" ]; then echo "skip $host (no token secret)"; return 0; fi
            printf 'Authorization: Bearer %s\n' "$token" | curl -sS --fail-with-body --retry 3 --retry-all-errors \
              -H @- -H 'Content-Type: application/json' -X POST -d "$BODY" "https://$host/v1/internal/release"
            echo
          }
          publish api-dev.luckgram.cc "${TOKEN_DEV:-}"
          publish api.luckgram.cc "${TOKEN_PROD:-}"
