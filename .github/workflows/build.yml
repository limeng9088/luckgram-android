name: Build APK

on:
  workflow_dispatch:
    inputs:
      abis:
        description: 'ABI 列表（空格分隔），例如 "arm64-v8a" 或 "armeabi-v7a arm64-v8a x86 x86_64"'
        required: false
        default: 'arm64-v8a'
  push:
    branches: [master]
    paths-ignore: ['**.md']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      NDK_VERSION: 27.2.12479018
      ABIS: ${{ github.event.inputs.abis || 'arm64-v8a' }}
    steps:
      # 原生依赖（ffmpeg/td/boringssl 等）体积大，先腾出磁盘空间
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # 默认只编 arm64-v8a 以缩短原生编译时间；只改 CI 工作副本，不提交
      - name: Restrict ABIs
        run: |
          list=$(printf '"%s", ' $ABIS); list=${list%, }
          sed -i "s/abiFilters \"armeabi-v7a\", \"arm64-v8a\", \"x86\", \"x86_64\"/abiFilters $list/" TMessagesProj_App/build.gradle
          grep -n abiFilters TMessagesProj_App/build.gradle

      - name: Build afat release APK
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace -Porg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-afat-release-${{ github.run_number }}
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
