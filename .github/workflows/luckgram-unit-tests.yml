name: Luckgram unit tests

# Plain-JVM tests of the Android-independent Luckgram classes
# (TMessagesProj/src/test/java/org/telegram/luckgram/**). No Android SDK / Gradle
# build: just javac + JUnit, a few seconds.
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'TMessagesProj/src/main/java/org/telegram/luckgram/**'
      - 'TMessagesProj/src/test/java/org/telegram/luckgram/**'
      - '.github/workflows/luckgram-unit-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      JUNIT_VERSION: 1.11.4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run tests
        run: |
          set -euo pipefail
          JAR=junit-platform-console-standalone-$JUNIT_VERSION.jar
          curl -fsSL -o "$RUNNER_TEMP/$JAR" "https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/$JUNIT_VERSION/$JAR"
          sha256sum "$RUNNER_TEMP/$JAR"
          # Each pure class is listed explicitly: it must not depend on android.* or org.telegram.*.
          SRC=TMessagesProj/src/main/java/org/telegram/luckgram
          mkdir -p "$RUNNER_TEMP/classes"
          javac -d "$RUNNER_TEMP/classes" -cp "$RUNNER_TEMP/$JAR" \
            $SRC/roundvideo/RoundVideoGeometry.java \
            $(find TMessagesProj/src/test/java/org/telegram/luckgram -name '*Test.java')
          java -jar "$RUNNER_TEMP/$JAR" execute --class-path "$RUNNER_TEMP/classes" --scan-class-path --details=tree --fail-if-no-tests
